name: Build installable Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "server/**"
      - ".github/workflows/build-android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Package source snapshot
        id: source_package
        shell: bash
        run: |
          version="$(node -p "require('./server/package.json').version")"
          mkdir -p dist
          git archive --format=zip --output="dist/loulou-sleep-guard-v${version}-source.zip" HEAD
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: loulou-sleep-guard-v${{ steps.source_package.outputs.version }}-source
          path: dist/loulou-sleep-guard-v${{ steps.source_package.outputs.version }}-source.zip
          if-no-files-found: error

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Test sleep guard server
        run: node --test
        working-directory: server
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Test Android offline state and guard transitions
        run: gradle -p android :app:testDebugUnitTest
      - name: Compile Android sources without signing
        run: gradle -p android :app:assembleDebug
      - name: Package debug test APK
        id: debug_package
        shell: bash
        run: |
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          test -n "$version"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/loulou-sleep-guard-v${version}-debug-test.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload debug test APK
        uses: actions/upload-artifact@v7
        with:
          name: loulou-sleep-guard-v${{ steps.debug_package.outputs.version }}-debug-test
          path: dist/loulou-sleep-guard-v${{ steps.debug_package.outputs.version }}-debug-test.apk
          if-no-files-found: error
      - name: Restore fixed release signing key
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/loulou-sleep-guard-release.jks"
          chmod 600 "$RUNNER_TEMP/loulou-sleep-guard-release.jks"
      - name: Build signed release APK
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/loulou-sleep-guard-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease
      - name: Give release APK a versioned filename
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        id: package
        shell: bash
        run: |
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' android/app/build.gradle.kts | head -n 1)"
          test -n "$version"
          test -n "$version_code"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/loulou-sleep-guard-v${version}.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
      - name: Verify package, version, and fixed signature
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/loulou-sleep-guard-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          apk="dist/loulou-sleep-guard-v${{ steps.package.outputs.version }}.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"
          "$build_tools/apksigner" verify --verbose "$apk"
          badging="$("$build_tools/aapt" dump badging "$apk" | head -n 1)"
          grep -F "package: name='com.rabbit.sleepguard'" <<< "$badging"
          grep -F "versionCode='${{ steps.package.outputs.version_code }}'" <<< "$badging"
          grep -F "versionName='${{ steps.package.outputs.version }}'" <<< "$badging"
          cert_info="$("$build_tools/apksigner" verify --print-certs "$apk" 2>&1)"
          actual_digest="$(printf '%s\n' "$cert_info" | awk -F': ' 'tolower($0) ~ /certificate sha-256 digest/ {print $NF; exit}' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          expected_digest="$(keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | openssl dgst -sha256 -binary | xxd -p -c 256 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          test -n "$actual_digest"
          printf 'APK certificate SHA-256: %s\n' "$actual_digest"
          test "$actual_digest" = "$expected_digest"
      - name: Upload installable release APK
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: loulou-sleep-guard-v${{ steps.package.outputs.version }}
          path: dist/loulou-sleep-guard-v${{ steps.package.outputs.version }}.apk
          if-no-files-found: error
